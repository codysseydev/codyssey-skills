version: 1
setup: []
checks:
  - name: pick-up-tests
    run: node --test playbooks/scripts/pick-up.test.mjs
  - name: post-merge-tests
    run: node --test playbooks/scripts/post-merge.test.mjs
  - name: capture-ui-tests
    run: node --test playbooks/scripts/capture-ui.test.mjs
  - name: trial-decision-tests
    run: node --test playbooks/scripts/trial-decision.test.mjs
  - name: test-first-tests
    run: node --test playbooks/scripts/test-first.test.mjs
  - name: bootstrap-tests
    run: python3 -m unittest discover -s factory/bootstrap/tests
  - name: event-model-tests
    run: python3 -m unittest discover -s factory/event-model/tests
  - name: factory-onboard-tests
    run: python3 -m unittest discover -s factory/factory-onboard/tests
  - name: standards-discovery-tests
    run: python3 -m unittest discover -s kanon/standards-discovery/tests
  - name: install-tests
    run: node --test playbooks/scripts/install.test.mjs
  - name: kanon-catalog-check
    run: node kanon/scripts/catalog.mjs check --base origin/main
  - name: kanon-catalog-tests
    run: node --test kanon/scripts/catalog.test.mjs
teardown: []
